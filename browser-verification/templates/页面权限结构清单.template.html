<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面权限结构清单</title>
<style>
:root{--blue:#173f69;--line:#dbe4ee;--bg:#f5f7fa;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:#1f2937}.app{height:calc(100vh - 32px);margin:16px auto;max-width:1400px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex:none}h1,h2{margin:0;color:var(--blue)}h1{font-size:22px}.sub{color:var(--muted);margin-top:5px}.toolbar{padding:14px 28px;border-bottom:1px solid var(--line);display:flex;gap:10px;background:#fbfcfe;flex:none}input,select,textarea{border:1px solid #cbd5e1;border-radius:6px;padding:9px 10px;font:inherit}input{flex:1}button{border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3f9;color:var(--blue)}.layout{display:grid;grid-template-columns:55% 45%;min-height:0;flex:1;overflow:hidden}.tree-panel,.detail-panel{padding:22px 26px;overflow:auto}.tree-panel{border-right:1px solid var(--line)}.tree-header{position:sticky;top:-22px;padding:22px 0 14px;background:#fff;z-index:2;display:flex;justify-content:space-between;align-items:center}.tree-header h2{font-size:18px}.count{font-weight:400;color:var(--muted);font-size:13px}.node{margin:3px 0}.row{display:flex;gap:7px;align-items:center;padding:9px 10px;border-radius:7px;cursor:pointer}.row:hover,.row.active{background:#eaf3fb}.name{flex:1}.children{margin-left:25px;padding-left:8px;border-left:1px solid var(--line)}.type{font-size:11px;border-radius:12px;padding:3px 8px;background:#e4effb;color:#28608f}.action{background:#e8f5df;color:#477735}.dialog{background:#fff0e7;color:#a65c34}.edit,.remove{border:0;background:transparent;color:#7890a8;padding:3px 5px}.remove:hover{color:#c33}.detail{max-width:700px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.label{font-weight:600;color:#475569}.actions{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.modal-bg{position:fixed;inset:0;background:#10253d66;display:none;align-items:center;justify-content:center;z-index:1000}.modal-bg.show{display:flex}.modal{position:relative;z-index:1001;width:min(560px,calc(100% - 32px));max-height:calc(100vh - 32px);overflow:auto;background:#fff;padding:24px;border-radius:12px}.modal-head{display:flex;justify-content:space-between;margin-bottom:16px}.modal-head button{padding:0;background:none;font-size:22px;color:var(--muted)}
.toggle{width:18px;height:18px;padding:0;border:0;border-radius:0;background:transparent;color:#64748b;line-height:18px;font-size:13px;appearance:none}
</style></head>
<body><main class="app">
<header><div><h1>页面权限结构清单</h1><div class="sub">产品视角的页面、菜单、页签、操作与弹层结构</div></div><div><label class="secondary file-button">导入 JSON<input id="jsonFile" type="file" accept=".json,application/json" onchange="importJson(this.files[0])"></label> <button class="secondary" onclick="exportJson()">导出 JSON</button> <button class="primary" onclick="alert('此处接入 Excel 导出')">导出 Excel</button></div></header>
<div class="toolbar"><input id="search" placeholder="搜索节点名称、路由或说明" oninput="render()"><select id="kind" onchange="render()"><option value="">全部类型</option><option>menu</option><option>page</option><option>tab</option><option>section</option><option>action</option><option>dialog</option><option>drawer</option></select><select id="status" onchange="render()"><option value="">全部状态</option><option>已验证</option><option>部分验证</option><option>待确认</option></select><button class="secondary" onclick="resetFilter()">重置</button></div>
<section class="layout"><aside class="tree-panel"><div class="tree-header"><h2>页面结构树 <span class="count" id="count"></span></h2><button class="secondary" onclick="collapseAll()">全部折叠</button> <button class="primary" onclick="addNode()">＋ 新增节点</button> <button class="primary" onclick="addRootNode()">＋ 新增根节点</button></div><div id="tree"></div></aside><section class="detail-panel"><h2>节点详情 <span class="count" id="selected"></span></h2><div id="detail"></div></section></section></main>
<div id="modal" class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>编辑节点</h2><button onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
let nodes=[{id:'M001',parentId:null,name:'业务工作',type:'menu',route:'',status:'已验证',desc:'业务工作导航菜单',source:'06-业务工作',open:true},{id:'M002',parentId:'M001',name:'远程监管',type:'menu',route:'/remote',status:'已验证',desc:'远程监管业务菜单',source:'06-业务工作'},{id:'T001',parentId:'M002',name:'监管分析',type:'tab',route:'/remote/analysis',status:'部分验证',desc:'远程监管分析页签',source:'06-业务工作'},{id:'A001',parentId:'T001',name:'导出',type:'action',route:'',status:'待确认',desc:'导出分析结果',source:'06-业务工作'},{id:'M003',parentId:'M001',name:'消息管理',type:'menu',route:'/message',status:'已验证',desc:'消息管理菜单',source:'07-消息管理'},{id:'T002',parentId:'M003',name:'通知公告',type:'tab',route:'/message/notice',status:'已验证',desc:'通知公告页签',source:'07-消息管理'}];
let selected=nodes[0]?.id||null;let draftNode=null,pendingDeleteId=null;const kids=id=>nodes.filter(n=>n.parentId===id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function match(n){let q=search.value.trim().toLowerCase(),t=kind.value,s=status.value;return(!q||[n.name,n.route,n.desc,n.source].join(' ').toLowerCase().includes(q))&&(!t||n.type===t)&&(!s||n.status===s)}function branch(n){return match(n)||kids(n.id).some(branch)}function path(id){let a=[],n=nodes.find(x=>x.id===id);while(n){a.unshift(n.name);n=nodes.find(x=>x.id===n.parentId)}return a.join(' ＞ ')}function toggleNode(id){let n=nodes.find(x=>x.id===id);if(n){n.open=!n.open;render()}}function render(){tree.innerHTML='';let count=0;function draw(parent,box){kids(parent).forEach(n=>{if(!branch(n))return;count++;if(search.value&&kids(n.id).some(branch))n.open=true;let el=document.createElement('div');el.className='node';el.innerHTML=`<div class="row ${selected===n.id?'active':''}" onclick="selectNode('${n.id}')"><button class="toggle" onclick="event.stopPropagation();toggleNode('${n.id}')">${kids(n.id).length?(n.open?'▾':'▸'):''}</button><span class="name">${esc(n.name)} <small style="color:#91a4ba">[${esc(n.source)}]</small></span><span class="type ${n.type}">${n.type}</span><button class="edit" onclick="event.stopPropagation();openEdit('${n.id}')">编辑</button><button class="remove" onclick="event.stopPropagation();removeNode('${n.id}')">删除</button></div>`;let sub=document.createElement('div');sub.className='children';if(!n.open)sub.style.display='none';el.appendChild(sub);box.appendChild(el);draw(n.id,sub)})}draw(null,tree);countEl(count)}function countEl(n){count.textContent=`${n} 个节点`}function selectNode(id){selected=id;render();showDetail()}function showDetail(){let n=nodes.find(x=>x.id===selected);if(!n){detail.innerHTML='<p>请选择节点</p>';return}document.getElementById('selected').textContent=n.id;detail.innerHTML=`<div class="grid"><label class="field"><span class="label">节点名称</span><input value="${esc(n.name)}" readonly></label><label class="field"><span class="label">节点类型</span><input value="${n.type}" readonly></label><label class="field full"><span class="label">层级路径</span><input value="${esc(path(n.id))}" readonly></label><label class="field"><span class="label">路由 path</span><input value="${esc(n.route)}" readonly></label><label class="field"><span class="label">验证状态</span><input value="${esc(n.status)}" readonly></label><label class="field"><span class="label">父级节点</span><input value="${esc(n.parentId||'无（根节点）')}" readonly></label><label class="field"><span class="label">来源文件</span><input value="${esc(n.source)}" readonly></label><label class="field full"><span class="label">统一说明</span><textarea readonly>${esc(n.desc)}</textarea></label></div><div class="actions"><button class="primary" onclick="openEdit('${n.id}')">编辑节点</button></div>`}function openEdit(id){selected=id;let n=nodes.find(x=>x.id===id);modalBody.innerHTML=`<div class="grid"><label class="field"><span class="label">节点名称</span><input id="mn" value="${esc(n.name)}"></label><label class="field"><span class="label">节点类型</span><select id="mt">${['menu','tab','action','dialog'].map(x=>`<option ${x===n.type?'selected':''}>${x}</option>`).join('')}</select></label><label class="field full"><span class="label">路由 path</span><input id="mr" value="${esc(n.route)}"></label><label class="field"><span class="label">验证状态</span><select id="ms">${['已验证','部分验证','待确认'].map(x=>`<option ${x===n.status?'selected':''}>${x}</option>`).join('')}</select></label><label class="field full"><span class="label">统一说明</span><textarea id="md">${esc(n.desc)}</textarea></label></div><div class="actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="saveEdit()">保存</button></div>`;modal.classList.add('show')}function closeModal(){draftNode=null;pendingDeleteId=null;modal.classList.remove('show')}function openDraftEdit(n){modalBody.innerHTML=`<div class="grid"><label class="field"><span class="label">节点名称</span><input id="mn" value="${esc(n.name)}"></label><label class="field"><span class="label">节点类型</span><select id="mt">${['menu','page','tab','section','action','dialog','drawer'].map(x=>`<option ${x===n.type?'selected':''}>${x}</option>`).join('')}</select></label><label class="field full"><span class="label">路由 path</span><input id="mr" value="${esc(n.route)}"></label><label class="field"><span class="label">验证状态</span><select id="ms">${['已验证','部分验证','待确认'].map(x=>`<option ${x===n.status?'selected':''}>${x}</option>`).join('')}</select></label><label class="field full"><span class="label">统一说明</span><textarea id="md">${esc(n.desc)}</textarea></label></div><div class="actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="saveEdit()">保存</button></div>`;modal.classList.add('show')}function readEditForm(n){return{name:mn.value.trim()||n.name,type:mt.value,route:mr.value.trim(),status:ms.value,desc:md.value.trim()}}function saveEdit(){if(draftNode){const n=Object.assign({},draftNode,readEditForm(draftNode));draftNode=null;nodes.push(n);selected=n.id;closeModal();render();showDetail();return}let n=nodes.find(x=>x.id===selected);if(!n){closeModal();return}Object.assign(n,readEditForm(n));closeModal();render();showDetail()}function addNode(){draftNode={id:'N'+Date.now(),parentId:selected,name:'新节点',type:'action',route:'',status:'待确认',desc:'待补充说明',open:true};openDraftEdit(draftNode)}function addRootNode(){draftNode={id:'N'+Date.now(),parentId:null,name:'新根节点',type:'menu',route:'',status:'待确认',desc:'待补充说明',open:true};openDraftEdit(draftNode)}function removeNode(id){pendingDeleteId=id;const n=nodes.find(x=>x.id===id);modalBody.innerHTML=`<div><p>确认删除节点“${esc(n?.name||'未命名节点')}”及其全部子节点？</p></div><div class="actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="confirmRemoveNode()">确认删除</button></div>`;modal.classList.add('show')}function confirmRemoveNode(){if(!pendingDeleteId)return;const id=pendingDeleteId;const ids=[id];for(let i=0;i<ids.length;i++)kids(ids[i]).forEach(n=>ids.push(n.id));nodes=nodes.filter(n=>!ids.includes(n.id));pendingDeleteId=null;selected=null;closeModal();render();showDetail()}function normalizeImportedNodes(payload){let roots=Array.isArray(payload)?payload:(payload&&Array.isArray(payload.productStructure)?payload.productStructure:(payload&&Array.isArray(payload.nodes)?payload.nodes:[]));let nested=roots.some(n=>Array.isArray(n&&n.children));let flat=[];function routeOf(n){return n&&n.route&&typeof n.route==='object'?(n.route.path||''):(n&&n.route||'')}function copy(n,parentId){if(!n||typeof n!=='object'||!n.id)return;let row={id:String(n.id),parentId:parentId===undefined?(n.parentId??null):parentId,name:n.name||'未命名节点',type:n.type||'action',route:routeOf(n.route),status:n.status||'待确认',desc:n.desc??n.description??'',source:typeof n.source==='string'?n.source:(n.source?.sourceFile||''),open:false};flat.push(row);(Array.isArray(n.children)?n.children:[]).forEach(c=>copy(c,row.id))}if(nested)roots.forEach(n=>copy(n,null));else roots.forEach(n=>{let row={...n,route:routeOf(n.route),desc:n.desc??n.description??'',source:typeof n.source==='string'?n.source:(n.source?.sourceFile||''),open:false};delete row.children;flat.push(row)});return flat}function importJson(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{nodes=normalizeImportedNodes(JSON.parse(reader.result));selected=nodes[0]?.id||null;resetFilter();showDetail()}catch(e){alert('JSON 导入失败：'+e.message)}};reader.readAsText(file,'utf-8')}function collapseAll(){nodes.forEach(n=>{n.open=false});render()}function resetFilter(){search.value='';kind.value='';status.value='';render()}function exportJson(){let b=new Blob([JSON.stringify({productStructure:nodes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='页面权限结构产品视角.json';a.click();URL.revokeObjectURL(a.href)}render();showDetail();
</script></body></html>
